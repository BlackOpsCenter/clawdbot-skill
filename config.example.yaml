# BlackOps Center API Configuration
# Copy this file to config.yaml and fill in your values

# Your personal access token from BlackOps Center
# Generate at: https://blackopscenter.com/admin/settings (Browser Extension section)
api_token: "your-token-here"

# Base URL for your BlackOps Center instance
# Default: https://blackopscenter.com
# For self-hosted or custom domains, change this
base_url: "https://blackopscenter.com"

# Optional: Set a default site by domain (NOT RECOMMENDED for multi-site users)
# If not set, you must specify --domain on every command
# Run 'blackops-center list-sites' to see your available sites
# 
# IMPORTANT: If you manage multiple sites (e.g., personal blog + company blog),
# DO NOT set default_domain. Always use --domain explicitly instead.
# This prevents accidentally posting to the wrong site.
#
# default_domain: "yourdomain.com"
